name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on:

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo_web_app/requirements.txt
          pip install pytest

      - name: Run automated tests
        run: |
          pytest demo_web_app/tests -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/satindersingh09/cicd-demo-app:latest \
            ./demo_web_app

      - name: Push Docker image
        run: |
          docker push ghcr.io/satindersingh09/cicd-demo-app:latest
  deploy:
    needs: test-and-build
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/cicd-demo-app

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cicd-demo-app --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get deployment cicd-demo-app -o wide
          kubectl get service cicd-demo-service


